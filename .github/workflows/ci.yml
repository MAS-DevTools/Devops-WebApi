name: CI

# GitHub Flow: every pull request to main is built and tested; a merge (push) to main also publishes an image.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests start PostgreSQL through Testcontainers; Docker is available on ubuntu runners.
      - name: Run unit and integration tests
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    name: Build and publish image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Unique tag per commit (sha-xxxxxxx); "latest" only as an extra alias on main.
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request the image is only built (to validate the Dockerfile), not pushed.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}

  # GitOps: the pipeline never talks to the cluster. It records the new image tag in Git,
  # and Argo CD inside the cluster pulls that change and rolls out the new version.
  update-manifest:
    name: Update Kubernetes manifest
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-manifest
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image tag in kustomization.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s/^\(\s*newTag:\).*/\1 ${TAG}/" k8s/app/kustomization.yaml
          grep newTag k8s/app/kustomization.yaml

      # Commits made with GITHUB_TOKEN do not start a new workflow run, so this cannot loop.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app/kustomization.yaml
          git diff --cached --quiet && { echo "Manifest already up to date"; exit 0; }
          git commit -m "Deploy ${GITHUB_SHA::7} to Kubernetes"
          git pull --rebase origin main
          git push origin HEAD:main
