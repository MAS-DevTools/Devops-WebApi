# Local environment: the API plus PostgreSQL. Start with: docker compose up --build
# The credentials below are local-only placeholders, never use them outside your own machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ConnectionStrings__ProductDb: "Host=db;Port=5432;Database=products;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
